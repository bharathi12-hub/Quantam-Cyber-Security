# INTENTIONALLY VULNERABLE sample for QuantumShield demo.
server {
    listen 443 ssl;
    server_name legacy.example.com;

    # Obsolete protocol versions still enabled
    ssl_protocols TLSv1.0 TLSv1.1 TLSv1.2;

    # Weak cipher suites including RC4 and 3DES
    ssl_ciphers "RC4-SHA:DES-CBC3-SHA:AES128-SHA";

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
}
